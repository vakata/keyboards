name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VIAL_COMMIT: dd43959ae5c08d8a28d38a1acf7b04e86b14a344

jobs:
  build:
    name: ${{ matrix.keyboard }} (${{ matrix.side }})
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/qmk/qmk_cli:latest

    strategy:
      fail-fast: false
      matrix:
        keyboard:
          - klor
          - swoop
        side:
          - generic
          - left
          - right
        exclude:
          - keyboard: swoop
            side: left
          - keyboard: swoop
            side: right

    steps:
      - name: Checkout keyboards
        uses: actions/checkout@v4

      - name: Checkout Vial-QMK
        uses: actions/checkout@v4
        with:
          repository: vial-kb/vial-qmk
          ref: ${{ env.VIAL_COMMIT }}
          submodules: recursive
          path: vial-qmk

      - name: Link keyboard sources
        run: |
          ln -s "$GITHUB_WORKSPACE/firmware/vakata" \
            "$GITHUB_WORKSPACE/vial-qmk/keyboards/vakata"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install compatible Python and QMK
        run: |
          uv python install 3.12
          uv tool install --force --python 3.12 \
            --with-requirements vial-qmk/requirements.txt qmk
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Verify Python environment
        run: |
          which qmk
          head -n 1 "$(which qmk)"
          qmk --version

      - name: Configure QMK
        run: |
          qmk config user.qmk_home="$GITHUB_WORKSPACE/vial-qmk"

      - name: Set handedness
        if: matrix.keyboard == 'klor' && matrix.side != 'generic'
        shell: bash
        run: |
          SIDE="${{ matrix.side }}"
          echo "#define INIT_EE_HANDS_${SIDE^^}" >> \
            firmware/vakata/klor/keymaps/vial/config.h

      - name: Compile
        working-directory: vial-qmk
        run: |
          qmk compile -kb vakata/${{ matrix.keyboard }} -km vial

      - name: Collect firmware
        shell: bash
        run: |
          mkdir -p artifacts

          KEYBOARD="${{ matrix.keyboard }}"
          SIDE="${{ matrix.side }}"
          SOURCE="vial-qmk/vakata_${KEYBOARD}_vial"

          if [ "$KEYBOARD" = "klor" ]; then
            cp "${SOURCE}.uf2" "artifacts/klor-${SIDE}.uf2"
          else
            cp "${SOURCE}.hex" artifacts/swoop.hex

            cp vial-qmk/quantum/split_common/eeprom-lefthand.eep \
              artifacts/swoop-left.eep

            cp vial-qmk/quantum/split_common/eeprom-righthand.eep \
              artifacts/swoop-right.eep
          fi

          cp "config/${KEYBOARD}.vil" artifacts/

      - name: Record build environment
        working-directory: vial-qmk
        run: |
          {
            echo "Vial-QMK commit:"
            git rev-parse HEAD

            echo "Submodules:"
            git submodule status --recursive

            echo "QMK CLI:"
            qmk --version

            echo "AVR compiler:"
            avr-gcc --version

            echo "ARM compiler:"
            arm-none-eabi-gcc --version
          } > ../artifacts/build-info.txt

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.keyboard }}-${{ matrix.side }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  package:
    name: Package all firmwares
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download firmwares
        uses: actions/download-artifact@v4
        with:
          path: firmwares

      - name: Upload complete bundle
        uses: actions/upload-artifact@v4
        with:
          name: all-firmwares
          path: firmwares/
          retention-days: 90

  release:
    name: Publish firmware release
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download firmware bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: all-firmwares
          path: firmwares

      - name: Prepare release assets
        run: |
          mkdir release

          find firmwares -type f \
            \( -name '*.uf2' -o -name '*.hex' \
            -o -name '*.eep' -o -name '*.vil' \) \
            -exec cp {} release/ \;

          (cd firmwares && zip -r ../release/all-firmwares.zip .)

          (cd release && sha256sum * > SHA256SUMS.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            release/*
